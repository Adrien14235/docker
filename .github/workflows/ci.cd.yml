name: CI Pipeline

on:
  push:
    branches: [ "main", "develop", "j2", "feature/**" ]
  pull_request:
    branches: [ "main", "develop", "j2" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm test

  security-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm audit --audit-level=high
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    needs: [test, security-deps]
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USER || secrets.DOCKERHUB_USERNAME }}/clickfast:${{ github.sha }}

  security-image:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: aquasecurity/trivy-action@master
        env:
          TRIVY_USERNAME: ${{ secrets.DOCKERHUB_USER || secrets.DOCKERHUB_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          image-ref: ${{ secrets.DOCKERHUB_USER || secrets.DOCKERHUB_USERNAME }}/clickfast:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

  sbom:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ secrets.DOCKERHUB_USER || secrets.DOCKERHUB_USERNAME }}/clickfast:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-cyclonedx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom-cyclonedx.json

  security-summary:
    needs: [security-deps, security-image, sbom]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resume securite
        run: |
          echo "## Resume securite" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Statut |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| npm audit & gitleaks | ${{ needs.security-deps.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy (image) | ${{ needs.security-image.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SBOM (Syft) | ${{ needs.sbom.result }} |" >> $GITHUB_STEP_SUMMARY
